<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="현실퀘스트">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>현실퀘스트</title>
<meta name="author" content="양섭">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Press+Start+2P&display=swap">
<style>
/* VOICE: 아침마다 열어 보고 싶은, 쾌활한 모바일 RPG의 작은 마을
   IDEA: 용사들이 머무는 마을 광장과 길드 퀘스트 게시판
   PICTURE: 실제 시각에 따라 낮·노을·밤이 바뀌는 도트 광장, 2등신 용사들이 돌아다님
   COLOUR and TYPE: 밤하늘 남색 바탕, 양피지 카드, 금색 버튼, 굵은 갈색 외곽선 / Do Hyeon + Press Start 2P 숫자
   LAYOUT: 광장(위) → 오늘의 퀘스트 게시판(아래), 소집·상세·진화는 겹창 */
:root{color-scheme:dark;--bg:#1b1f3b;--bg2:#252a52;--ink:#2b1d2e;--paper:#fff4dc;--paper2:#f1deb6;--gold:#ffcf3a;--txt:#fdf6e3}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{overscroll-behavior:none;background:var(--bg);color:var(--txt);font:17px/1.45 "Do Hyeon",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font:inherit;color:inherit;touch-action:manipulation}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #8ff3ff;outline-offset:2px}
.btn{font-size:18px;min-height:44px;padding:6px 16px;border:3px solid var(--ink);border-radius:10px;background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -4px 0 rgba(0,0,0,.13),inset 0 3px 0 rgba(255,255,255,.55);cursor:pointer;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.13)}
.btn.done{background:#86de7e}.btn.ghost{background:#e6d6b4}.btn.red{background:#ff7d6e}.btn.blue{background:#7cc6ff}
.btn:disabled{opacity:.75;cursor:default}

/* splash */
#splash{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 40%,#2c3370,#10132b 70%);cursor:pointer;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
#splash .en{font:13px/1 "Press Start 2P",monospace;color:#ffcf3a;text-shadow:0 2px 0 #2b1d2e}
#splash .press{font-size:18px;color:#fdf6e3;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* scene */
.scene{position:relative;overflow:hidden;background:#10132b;border-bottom:4px solid var(--ink)}
#town{display:block;cursor:pointer}
#tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:auto;cursor:pointer;background:none;border:0;padding:0;will-change:transform}
.tag .nm{font-size:14px;line-height:1;padding:3px 6px 2px;border-radius:6px;background:rgba(27,20,40,.78);color:#fff;white-space:nowrap}
.tag .nm b{font:9px "Press Start 2P",monospace;color:#ffd23f;margin-right:4px}
.tag .q{font:13px/1 "Press Start 2P",monospace;color:var(--ink);background:#ffd23f;border:2px solid var(--ink);border-radius:6px;padding:3px 4px 2px;animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px max(3vw,10px,env(safe-area-inset-right)) 10px max(3vw,10px,env(safe-area-inset-left));pointer-events:none}
.hud>*{pointer-events:auto}
.pill{font-size:16px;background:rgba(27,20,40,.8);border:2px solid #000;border-radius:999px;padding:4px 12px;color:#fff;white-space:nowrap}
.pill b{color:#ffd23f}
.fab{position:absolute;right:max(3vw,10px);bottom:12px}
.empty{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:min(92%,380px);text-align:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:14px 16px;box-shadow:0 5px 0 #0c0e22}
.empty p{margin:0 0 10px}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* board */
main{max-width:920px;margin:0 auto;padding:22px max(4vw,14px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(4vw,14px,env(safe-area-inset-left))}
.backup{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bhead h2{margin:0;font-size:30px;font-weight:400;line-height:1.05;color:#fff;text-shadow:0 3px 0 #0c0e22}
.bhead h2 small{font-size:18px;color:#ffd23f;margin-left:8px}
#list{display:grid;gap:14px}
.card{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 #0c0e22;padding:10px 12px}
.card.clear{background:#eef6d8}
.card.off{opacity:.8}
.por{width:76px;height:84px;border:3px solid var(--ink);border-radius:10px;background:radial-gradient(circle at 50% 78%,#fff8 0 30%,transparent 31%),var(--c);display:grid;place-items:center;cursor:pointer;padding:0}
.por canvas{width:56px;height:64px}
.r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.r1 .nm{font-size:22px;line-height:1.1}
.lv{font:13px "Press Start 2P",monospace;color:#c97c0c}
.sub{font-size:15px;color:#7a5a48}
.task{font-size:18px;margin:2px 0 6px}
.bar{height:16px;border:3px solid var(--ink);border-radius:8px;background:#3a2f4d;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#66d6ff 0 7px,#3d9dff 7px 9px);transition:width .6s steps(12)}
.bar.max i{background:repeating-linear-gradient(90deg,#ffe066 0 7px,#ffb52e 7px 9px)}
.meta{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:14px;color:#7a5a48;margin-top:4px}
.note{margin-top:22px;font-size:14px;color:#a9acd6;text-align:center}
@media(max-width:560px){.card{grid-template-columns:64px minmax(0,1fr)}.por{width:64px;height:72px}.por canvas{width:42px;height:48px}.act{grid-column:1/-1}.act .btn{width:100%}}

/* modal */
.modal{position:fixed;inset:0;z-index:40;background:rgba(8,9,24,.72);display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
.sheet{width:min(100%,580px);max-height:calc(100dvh - 28px);overflow:auto;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 #0c0e22;padding:18px 18px 20px}
.sheet h2{margin:0 0 12px;font-size:30px;font-weight:400;line-height:1.05}
.sheet h3{margin:18px 0 8px;font-size:20px;font-weight:400}
label.f{display:block;margin-top:12px;font-size:17px}
input{font:inherit;font-size:17px;width:100%;min-height:44px;margin-top:4px;padding:6px 12px;border:3px solid var(--ink);border-radius:10px;background:#fffaf0;color:var(--ink)}
.cls{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:6px}
.tabs.gen{margin:6px 0 0}
.cls button{border:3px solid var(--ink);border-radius:10px;background:var(--paper2);padding:4px 0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:15px}
.cls button[aria-pressed=true]{background:var(--gold);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.cls canvas{display:block;width:42px;height:48px}
@media(max-width:480px){.cls{grid-template-columns:repeat(3,minmax(0,1fr))}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips button{border:2px solid var(--ink);border-radius:999px;background:#fffaf0;padding:4px 12px;min-height:36px;font-size:15px;cursor:pointer}
.pv{display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(#7ec8f5,#bfe6fa 60%,#e2cfa5 60%);border:3px solid var(--ink);border-radius:12px;padding:8px}
.pv canvas{width:84px;height:96px}
.pv .arr{font:16px "Press Start 2P",monospace;color:var(--ink)}
.pv p{margin:0;font-size:15px;text-align:center}
.calc{background:#fff;border:2px dashed #b89a74;border-radius:10px;padding:8px 12px;margin:14px 0 0;font-size:16px}
.calc b{color:#c0392b}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.foot .sp{flex:1}
.dtop{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.dtop .por{width:112px;height:124px}.dtop .por canvas{width:84px;height:96px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.stats div{background:#fffaf0;border:2px solid var(--ink);border-radius:10px;padding:6px 4px;text-align:center;font-size:14px;color:#7a5a48}
.stats b{display:block;font-size:22px;color:var(--ink);font-weight:400;white-space:nowrap}
@media(max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.road{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.road div{flex:none;width:68px;scroll-snap-align:start;text-align:center;background:#fffaf0;border:2px solid var(--ink);border-radius:10px;padding:4px 0;font-size:14px;line-height:1.15}
.road div.now{background:var(--gold)}
.road canvas{display:block;margin:0 auto 2px;width:42px;height:48px}
.road small{display:block;font-size:13px;color:#7a5a48}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:4px}
.cal span{height:30px;display:grid;place-items:center;border:2px solid #cdb48e;border-radius:6px;font-size:13px;color:#a08a6a;background:#fffaf0}
.cal span.ok{background:var(--gold);border-color:var(--ink);color:var(--ink)}
.cal span.miss{background:#ead9bb}
.cal span.today{outline:3px solid #3d9dff;outline-offset:-1px}


/* 로그인 */
#auth{position:fixed;inset:0;z-index:50;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 30%,#2c3370,#10132b 70%)}
.abox{width:min(100%,420px);background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:18px;box-shadow:0 7px 0 #0c0e22;padding:18px}
.abox .lead{margin:4px 0 6px;font-size:18px}
.abox form .btn{width:100%;margin-top:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.tabs button{min-height:44px;border:3px solid var(--ink);border-radius:10px;background:var(--paper2);font-size:17px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--gold)}
.err{min-height:1.2em;margin:8px 0 0;color:#c0392b;font-size:16px}
.code{font-family:"Press Start 2P",monospace;letter-spacing:.12em}
input.code{font-size:20px;text-transform:uppercase}
.big.code{font-size:clamp(24px,8vw,34px);text-align:center;background:#1b1f3b;color:#ffd23f;border:3px solid var(--ink);border-radius:12px;padding:18px 8px 14px;margin:8px 0 12px}
.btn .code{font-size:13px;margin-left:4px}
/* 타이틀: 하늘 위에 떠서 움직이는 로고 (위쪽 흐림은 하늘에 걸리도록) */
.hud{padding:calc(env(safe-area-inset-top) + 30px) max(3vw,12px,env(safe-area-inset-right)) 10px max(3vw,12px,env(safe-area-inset-left));align-items:center}
.title{display:flex;align-items:flex-end;animation:drop .9s cubic-bezier(.3,1.6,.5,1) both}
.title canvas{display:block;animation:wave 1.8s ease-in-out infinite,glint 3.6s linear infinite;filter:drop-shadow(0 3px 0 rgba(12,14,34,.55))}
@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-4deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(1px) rotate(2deg)}}
@keyframes drop{0%{transform:translateY(-70px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
@keyframes glint{0%,84%,100%{filter:drop-shadow(0 3px 0 rgba(12,14,34,.55)) brightness(1)}90%{filter:drop-shadow(0 3px 0 rgba(12,14,34,.55)) brightness(1.7)}}
@media(prefers-reduced-motion:reduce){.title,.title canvas{animation:none}}
/* 제작자 표기 */
.sign{font-size:15px;color:#a9acd6;margin:0;letter-spacing:.03em}
#splash .sign{position:absolute;bottom:max(18px,env(safe-area-inset-bottom))}
.wm{position:absolute;left:10px;bottom:10px;font-size:13px;color:#fff;background:rgba(27,20,40,.6);border-radius:999px;padding:3px 9px 2px;pointer-events:none}
.credit{margin-top:26px;text-align:center;font-size:14px;color:#7f83b8}
/* 친구 */
.bbtn{display:flex;gap:8px;flex-wrap:wrap}
.mycode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#1b1f3b;color:#fff;border:3px solid var(--ink);border-radius:12px;padding:10px 12px}
.mycode b{font-size:20px;color:#ffd23f;font-weight:400}.mycode span{font-size:15px;color:#c7c9ee}.mycode .btn{margin-left:auto;min-height:40px}
.muted{color:#7a5a48;font-size:15px;margin:8px 0}
.row2{display:flex;gap:8px;align-items:flex-end}.row2 label{flex:1}.row2 .btn{flex:none}
.fcard{background:#fffaf0;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.fhead{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}.fhead b{font-size:20px;font-weight:400}
.fstat{font-size:15px;color:#2f8a42}
.fheroes{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.fh{flex:none;width:64px;text-align:center;font-size:13px;line-height:1.2;border-radius:8px;padding:4px 2px;background:#f1deb6}
.fh.ok{background:#d9f2c6}.fh canvas{display:block;margin:0 auto;width:42px;height:48px}
.fh span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fh small{color:#c97c0c}
.fact{text-align:right}.mini{border:0;background:none;color:#a05a48;font-size:14px;text-decoration:underline;cursor:pointer;min-height:32px}
/* 컬렉션 · 사운드 */
.hr{display:flex;align-items:center;gap:8px}
.snd{width:40px;height:40px;border-radius:50%;border:2px solid #000;background:rgba(27,20,40,.8);color:#ffd23f;font:15px "Press Start 2P",monospace;cursor:pointer;position:relative;padding:0}
.snd.off{color:#8a8aa8}.snd.off::after{content:'';position:absolute;left:8px;right:8px;top:50%;height:3px;background:#ff6b6b;transform:rotate(-40deg)}
.mytitle{margin:-6px 0 12px}.mytitle .mini{color:#ffd23f;font-size:16px;text-decoration:none}
.stk{display:flex;gap:6px 14px;flex-wrap:wrap;margin:10px 0 4px;font-size:15px;color:#7a5a48}.stk b{color:var(--ink);font-weight:400}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.cc{background:#ece0c4;border:2px solid #cdb48e;border-radius:10px;padding:6px 4px;text-align:center;font-size:14px;line-height:1.2}
.cc.got{background:#fffaf0;border-color:var(--ink)}
.cc canvas{display:block;margin:0 auto;width:56px;height:64px}
.cc b{display:block;font-weight:400}.cc small{display:block;font-size:13px;color:#7a5a48;margin-top:2px}
.tlist{display:grid;gap:6px}
.trow{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:2px solid var(--ink);border-radius:10px;background:#fffaf0;padding:8px 12px;cursor:pointer;min-height:44px;color:var(--ink)}
.trow b{font-weight:400;font-size:18px}.trow small{font-size:13px;color:#7a5a48}
.trow.sel{background:var(--gold)}.trow.lock{opacity:.6;cursor:default;border-color:#cdb48e}
.wardrobe .wc{flex:none;width:72px;border:2px solid var(--ink);border-radius:10px;background:#fffaf0;padding:4px 0;font-size:13px;line-height:1.2;cursor:pointer;scroll-snap-align:start;color:var(--ink)}
.wardrobe .wc.on{background:var(--gold)}.wardrobe .wc canvas{display:block;margin:0 auto;width:42px;height:48px}
.ftitle{color:#c97c0c;font-size:15px}
.adm{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:10px 0;padding:8px 10px;border:2px dashed #c97c0c;border-radius:10px;background:#fff4d6}.adm b{font-weight:400;color:#c97c0c;margin-right:4px}.adm .btn{min-height:36px;padding:4px 10px;font-size:15px}
.hcol{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.hcol button{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;font-size:12px;color:var(--ink);padding:0}.hcol button[aria-pressed=true]{box-shadow:0 0 0 3px var(--gold)}
.pnote{list-style:none;padding:0;margin:8px 0;display:grid;gap:8px}.pnote li{background:#fffaf0;border:2px solid var(--ink);border-radius:10px;padding:8px 12px}.pnote b{display:block;font-weight:400;font-size:18px}.pnote span{font-size:14px;color:#7a5a48}
.fhlist{display:grid;gap:6px;margin:6px 0}.fhero{display:flex;align-items:center;gap:8px;background:#f1deb6;border-radius:8px;padding:4px 8px}.fhero.ok{background:#d9f2c6}.fhero canvas{flex:none;width:42px;height:48px}
.fhinfo{flex:1;min-width:0;font-size:14px;line-height:1.3}.fhinfo b{font-weight:400;font-size:16px}.fhinfo small{color:#c97c0c}.ftask{display:block;color:#5a4636;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cheer{flex:none;min-height:40px;min-width:58px;border:2px solid var(--ink);border-radius:10px;background:#ff8fb6;color:var(--ink);font-size:15px;cursor:pointer}.cheer.done{background:#e8dcc4;color:#8a7a68;cursor:default}
.freq{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff4d6;border:2px dashed #c97c0c;border-radius:10px;padding:6px 10px;margin-bottom:6px}.freq b{font-weight:400;font-size:17px}.freq span{display:flex;gap:6px}.freq .btn{min-height:38px;padding:4px 12px}
.steps{padding-left:22px;line-height:1.7;margin:8px 0}
/* toast + evolution */
#toast{pointer-events:none;position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:70;transform:translate(-50%,calc(100% + 60px));transition:transform .3s;background:var(--ink);color:#fff;border:3px solid #ffd23f;border-radius:12px;padding:10px 16px;font-size:18px;max-width:92vw;text-align:center}
#toast.on{transform:translate(-50%,0)}
#toast b{font:13px "Press Start 2P",monospace;color:#ffd23f}
#evo{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#10132b;overflow:hidden;text-align:center;padding:20px}
#evo .rays{position:absolute;left:50%;top:42%;width:180vmax;height:180vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,210,63,.16) 0 10deg,transparent 10deg 20deg);animation:spin 18s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#evo>*:not(.rays){position:relative}
#evoC{width:168px;height:192px}
#evoC.flash{animation:flash 1.4s steps(8)}
@keyframes flash{0%,60%{filter:brightness(0) invert(1)}100%{filter:none}}
#evo p{margin:0;font-size:22px}
#evo small{font-size:16px;color:#c7c9ee}
@media(prefers-reduced-motion:reduce){#evo .rays,.tag .q,#splash .press{animation:none}#evoC.flash{animation:none}}
</style>
</head>
<body>
<div id="splash" role="button" tabindex="0" aria-label="현실퀘스트 시작">
  <canvas id="logo" aria-hidden="true"></canvas>

if('serviceWorker' in navigator&&location.protocol!=='file:'){const had=!!navigator.serviceWorker.controller;let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update();document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update()})}).catch(()=>{})}
